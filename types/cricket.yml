# The County Championship, stored. Every record is seeded from reference/ (built by
# scripts/build_reference.py from Cricsheet's ball-by-ball JSON) and never fetched.
#
#   CountyMatch ─TEAM─▶ CountyTeam
#   TeamInnings ─IN_MATCH─▶ CountyMatch
#   BattingInnings ─IN_MATCH─▶ CountyMatch,  ─BY─▶ CricketPlayer
#   BowlingInnings ─IN_MATCH─▶ CountyMatch,  ─BY─▶ CricketPlayer
#
# Grain matters: a BattingInnings is ONE batter in ONE team innings (a batter who bats
# twice in a match has two), a BowlingInnings is one bowler's figures in one team
# innings. Season totals are sums over those rows — the views do the summing.

- name: CountyTeam
  description: "One of the 18 first-class counties in the County Championship, e.g. `Surrey`, `Yorkshire`. Matches reach it via (m:CountyMatch)-[:TEAM]->(t:CountyTeam); a team's innings and players' rows carry its name as `team`."
  userAnchor: false
  properties:
    name:
      identity: true
      description: "The county's name as Cricsheet spells it, e.g. `Nottinghamshire`. Identity."
    firstSeason:
      type: int
      description: "First season in the data, e.g. 2014."
    lastSeason:
      type: int
      description: "Latest season in the data."
    matches:
      type: int
      description: "County Championship matches played across all seasons in the data."

- name: CricketPlayer
  description: "A cricketer who has played in a County Championship match since 2014, identified by Cricsheet's registry id — never by name, which is abbreviated (`JE Root`) and can change spelling between seasons. Batting innings and bowling spells reach a player via BY."
  userAnchor: false
  properties:
    playerId:
      identity: true
      description: "Cricsheet's 8-character registry id, e.g. `7081848a`. Identity."
    name:
      description: "Name as Cricsheet prints it in scorecards, usually initials and surname (`GH Roderick`), occasionally a full name. Search with toLower(p.name) CONTAINS."
    teams:
      cardinality: LIST
      description: "Every county this player has appeared for in the data."
    firstSeason:
      type: int
      description: "First season with an appearance."
    lastSeason:
      type: int
      description: "Latest season with an appearance."
    matches:
      type: int
      description: "Matches in which the player was in the eleven."

- name: CountyMatch
  description: "One County Championship match (four-day, first-class), 2014 to 2026. Two teams, a result, a margin, the venue and dates. NO championship points, bonus points or deductions are held anywhere in this realm: a question about points cannot be answered from it, and must not be approximated by counting wins. `stage` is the division (1 or 2) — except 2021, a conference season, where it is the group (1, 2 or 3); `stageName` says which. The winner is stored only when there was one; `result` is `won`, `draw` or `tie`."
  userAnchor: false
  properties:
    matchId:
      identity: true
      description: "Cricsheet's match id, which is also ESPNcricinfo's, e.g. `947089`. Identity."
    season:
      type: int
      description: "Season year, 2014–2026 (no 2020: that year's Bob Willis Trophy is not in this realm)."
    stage:
      type: int
      description: "Division 1 or 2; in 2021 the group, 1–3."
    stageName:
      description: "`Division 1`, `Division 2`, or in 2021 `Group 1`–`Group 3`."
    competition:
      description: "The sponsored name that season, e.g. `Specsavers County Championship`."
    startDate:
      description: "First scheduled day, ISO date."
    endDate:
      description: "Last day played, ISO date."
    days:
      type: int
      description: "Days on which play was scheduled, usually 4."
    venue:
      description: "Ground, e.g. `County Ground, Bristol`."
    city:
      description: "Town or city of the ground."
    team1:
      description: "The team Cricsheet lists first (normally the home side)."
    team2:
      description: "The team Cricsheet lists second (normally the visitors)."
    tossWinner:
      description: "Who won the toss. Many Championship tosses are uncontested: the visitors may choose to bowl."
    tossDecision:
      description: "`bat` or `field`."
    tossUncontested:
      type: boolean
      description: "True when the toss was not contested (the visitors elected to bowl)."
    result:
      description: "`won` (a team won), `draw` or `tie`."
    winner:
      description: "The winning team; absent on a draw or tie."
    loser:
      description: "The losing team; absent on a draw or tie."
    margin:
      description: "The margin in words, e.g. `an innings and 47 runs`, `7 wickets`, `123 runs`; empty for a draw."
    marginRuns:
      type: int
      description: "Runs in the margin, when the win was by runs (or by an innings and runs)."
    marginWickets:
      type: int
      description: "Wickets in the margin, when the win was by wickets."
    byInnings:
      type: boolean
      description: "True when won by an innings."
    url:
      description: "The match on ESPNcricinfo."

- name: TeamInnings
  description: "One team's innings in a County Championship match: total, wickets, overs, whether declared or forfeited, and the extras. A match has up to four; `inningsNo` orders them. Reaches its match via IN_MATCH."
  userAnchor: false
  properties:
    key:
      identity: true
      description: "`<matchId>-<inningsNo>`, e.g. `947089-3`. Identity."
    matchId:
      description: "The match's id."
    inningsNo:
      type: int
      description: "1 to 4, in order played."
    season:
      type: int
      description: "Season year."
    team:
      description: "The batting team."
    bowlingTeam:
      description: "The fielding team."
    runs:
      type: int
      description: "Total runs, extras and penalty runs included."
    wickets:
      type: int
      description: "Wickets fallen (retirements are not wickets)."
    balls:
      type: int
      description: "Legal deliveries bowled."
    overs:
      description: "Overs as printed, e.g. `92.3`."
    declared:
      type: boolean
      description: "True when the innings was declared closed."
    forfeited:
      type: boolean
      description: "True when the innings was forfeited (no balls bowled)."
    allOut:
      type: boolean
      description: "True when the innings ended with the side all out (10 wickets, or fewer with a batter absent hurt)."
    extras:
      type: int
      description: "Byes + leg byes + wides + no balls + penalty runs conceded in the innings."
    byes:
      type: int
    legbyes:
      type: int
    wides:
      type: int
    noballs:
      type: int
    penalty:
      type: int
      description: "Penalty runs awarded to the batting side in this innings."

- name: BattingInnings
  description: "One batter's innings: runs, balls faced, boundaries, how out and by whom. A batter who did not come in has no row, so count(rows) is innings batted. `notOut` is true for not out, retired hurt and retired not out. Reaches the player via BY and the match via IN_MATCH; `season`, `team` and `opponent` are carried on the row so a season's leaders need no join."
  userAnchor: false
  properties:
    key:
      identity: true
      description: "`<matchId>-<inningsNo>-<position>`, e.g. `947089-1-4`. Identity."
    matchId:
      description: "The match's id."
    inningsNo:
      type: int
      description: "Which team innings of the match, 1–4."
    season:
      type: int
      description: "Season year."
    stage:
      type: int
      description: "Division (or 2021 group)."
    date:
      description: "The match's first day, ISO date."
    team:
      description: "The batter's team."
    opponent:
      description: "The bowling side."
    venue:
      description: "Ground."
    playerId:
      description: "The batter's Cricsheet id — the key for a career."
    player:
      description: "The batter's name as printed."
    position:
      type: int
      description: "Batting position, 1–11, by order of arrival at the crease."
    runs:
      type: int
      description: "Runs scored."
    balls:
      type: int
      description: "Balls faced (wides excluded, no balls included)."
    fours:
      type: int
    sixes:
      type: int
    notOut:
      type: boolean
      description: "True if not dismissed (including retired hurt)."
    dismissal:
      description: "`caught`, `bowled`, `lbw`, `run out`, `stumped`, `caught and bowled`, `hit wicket`, `obstructing the field`, `handled the ball`, `retired hurt`, `retired not out`, or `not out`."
    bowler:
      description: "The bowler credited with the dismissal, where one is."
    fielders:
      description: "Fielders involved (catcher, stumper, or the run-out fielders), comma separated."

- name: BowlingInnings
  description: "One bowler's figures in one team innings: overs, maidens, runs conceded, wickets. Wickets are only those credited to the bowler (caught, bowled, lbw, stumped, hit wicket, caught and bowled); runs conceded exclude byes and leg byes. Reaches the player via BY and the match via IN_MATCH."
  userAnchor: false
  properties:
    key:
      identity: true
      description: "`<matchId>-<inningsNo>-<playerId>`. Identity."
    matchId:
      description: "The match's id."
    inningsNo:
      type: int
      description: "Which team innings of the match, 1–4."
    season:
      type: int
      description: "Season year."
    stage:
      type: int
      description: "Division (or 2021 group)."
    date:
      description: "The match's first day, ISO date."
    team:
      description: "The bowler's (fielding) team."
    opponent:
      description: "The batting side."
    venue:
      description: "Ground."
    playerId:
      description: "The bowler's Cricsheet id."
    player:
      description: "The bowler's name as printed."
    bowlOrder:
      type: int
      description: "1 for the opening bowler, 2 for the other end, and so on in order of first over."
    balls:
      type: int
      description: "Legal deliveries."
    overs:
      description: "Overs as printed, e.g. `18.4`."
    maidens:
      type: int
      description: "Complete overs by this bowler with no runs conceded off the bat, wides or no balls."
    runs:
      type: int
      description: "Runs conceded: off the bat, plus wides and no balls."
    wickets:
      type: int
      description: "Wickets credited to the bowler."
    dots:
      type: int
      description: "Deliveries from which no run of any kind came."
    fours:
      type: int
      description: "Fours conceded off the bat."
    sixes:
      type: int
      description: "Sixes conceded off the bat."
    wides:
      type: int
    noballs:
      type: int
